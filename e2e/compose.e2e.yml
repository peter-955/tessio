name: tessio-e2e

x-backend: &backend
  build:
    context: ../server
    additional_contexts:
      plugin: ../claude
  image: tessio-e2e-api
  environment:
    DATABASE_URL: postgresql+asyncpg://tessio:tessio@postgres:5432/tessio_e2e
    REDIS_URL: redis://redis:6379
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_SECURITY: none
    MAIL_SENDER: Tessio <no-reply@tessio.e2e>
    TESSIO_ENCRYPTION_KEY: dGVzc2lvLWUyZS1lbmNyeXB0aW9uLWtleS0zMmJ5dGU=
    TESSIO_ENCRYPTION_KEY_ID: "1"
    SESSION_COOKIE_SECURE: "false"
    CLIENT_URL: http://localhost:3211
    S3_ENDPOINT_URL: http://rustfs:9000
    S3_PUBLIC_ENDPOINT_URL: http://localhost:3218
    S3_REGION: eu-west-3
    S3_BUCKET: tessio
    S3_ACCESS_KEY_ID: tessio
    S3_SECRET_ACCESS_KEY: tessio-local-secret
    LOG_LEVEL: INFO
    SENTRY_ENVIRONMENT: e2e
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: tessio
      POSTGRES_PASSWORD: tessio
      POSTGRES_DB: tessio_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessio -d tessio_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - "3217:8025"

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: tessio
      RUSTFS_SECRET_KEY: tessio-local-secret
    ports:
      - "3218:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  rustfs-bucket:
    image: amazon/aws-cli:2.39.3
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: tessio
      AWS_SECRET_ACCESS_KEY: tessio-local-secret
      AWS_DEFAULT_REGION: eu-west-3
    entrypoint: >
      /bin/sh -c "until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://tessio || true;
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket tessio --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:3211\"],\"AllowedMethods\":[\"POST\",\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}'"

  fake-jira:
    build: ./fake-jira
    image: tessio-e2e-fake-jira
    ports:
      - "3219:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    ports:
      - "3212:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-bucket:
        condition: service_completed_successfully
      fake-jira:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  client:
    build:
      context: ../client
      args:
        TESSIO_SERVER_URL: http://api:8000
    image: tessio-e2e-client
    ports:
      - "3211:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/sign-in"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
