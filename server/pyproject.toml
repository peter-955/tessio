[project]
name = "tessio-server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.123",
    "bullmq>=3.4.6",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.2",
    "pyotp>=2.10.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sentry-sdk>=2.73.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "boto3-stubs[s3]>=1.43.123",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "testcontainers[postgres,redis]>=4.15.0",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "TID", "PL"]
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"app/**/typing/enums/*.py" = ["S105"]
"app/shared/permissions/*capability.py" = ["S105"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "bullmq.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "shared and config never import modules or api"
type = "forbidden"
source_modules = ["app.shared", "app.config"]
forbidden_modules = ["app.modules", "app.api"]

[[tool.importlinter.contracts]]
name = "modules never import api"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.api"]

