name: tessio

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/tessio-api:${TESSIO_IMAGE_TAG:?TESSIO_IMAGE_TAG is required}
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rustfs:
      condition: service_healthy
    rustfs-bucket:
      condition: service_completed_successfully

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      TESSIO_DOMAIN: ${TESSIO_DOMAIN:?TESSIO_DOMAIN is required}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?STORAGE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - client

  client:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/tessio-client:${TESSIO_IMAGE_TAG:?TESSIO_IMAGE_TAG is required}
    restart: unless-stopped
    logging: *logging
    expose:
      - "3000"

  api:
    <<: *backend
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.worker"]

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: tessio
      POSTGRES_DB: tessio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessio -d tessio"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    logging: *logging
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    logging: *logging
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-o",
          "/dev/null",
          "http://127.0.0.1:9000/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs-bucket:
    image: amazon/aws-cli:2.39.3
    restart: "no"
    logging: *logging
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      AWS_DEFAULT_REGION: ${S3_REGION:-eu-west-3}
    entrypoint: >
      /bin/sh -c "until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://${S3_BUCKET:-tessio} || true;
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket ${S3_BUCKET:-tessio} --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"https://${TESSIO_DOMAIN:?TESSIO_DOMAIN is required}\"],\"AllowedMethods\":[\"POST\",\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}'"

  bull-board:
    image: venatum/bull-board:3.4.15
    profiles: ["ops"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_PREFIX: bull
      BULL_VERSION: BULLMQ
      USER_LOGIN: ${BULL_BOARD_USER:?BULL_BOARD_USER is required}
      USER_PASSWORD: ${BULL_BOARD_PASSWORD:?BULL_BOARD_PASSWORD is required}
    ports:
      - "127.0.0.1:3205:3000"

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  rustfs-data:
